summary: psql backend smoke test
description: |
  Exercises the PostgreSQL type OID mapping against db/psql/create_table_test.sql.
  Note the placeholder style: PostgreSQL uses $1, $2 where DB2 uses ?.
statements:
  - id: sql_1
    res-buf-size: 5
    par-buf-size: 2
    dscr: |
      select every column of the test table, so that a describe walks the
      whole of rtl::psql::from_oid()
    sql: |
      sql that should not be used in psql testing
    psql: |
      select *
        from test
        where
          col_smallint = $1
    # PostgreSQL declares no width for text/json/bytea, so those fall back to
    # --max-field-len. Narrow the ones we know stay small.
    field-len:
      col_text: 128
      col_bytea: 32
  - id: sql_2
    sql: select col_smallint, col_integer, col_numeric from test
    result-names: [a, b, c, d] # more names than columns, on purpose
  - id: sql_3
    dscr: insert to check parameter describing
    sql: |
      insert into test
        (col_smallint, col_integer)
        values
        ($1, $2)
    parameter-names: [a1]  # only one, on purpose
